[project]
name = "dossier-builder-qaqc"
version = "0.1.0"
description = "Generador de Dossiers de Calidad QA/QC: plantillas con bookmarks, insercion de documentos por seccion, aplanado seguro de firmas y reconstruccion de bookmarks."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7.0",
    "PyMuPDF>=1.24,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
